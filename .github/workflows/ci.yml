name: CI

on:
  push:
    branches: [ main, lab01 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify

      - name: Build and verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: lab01-jar-${{ matrix.os }}
          path: target/maven-actions-hello-0.1.0.jar