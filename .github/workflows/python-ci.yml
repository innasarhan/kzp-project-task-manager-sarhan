name: Python CI

on:
  push:
    branches: [develop-python]
    paths:
      - "python/lab06/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main, develop-python]
    paths:
      - "python/lab06/**"
      - ".github/workflows/python-ci.yml"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: python/lab06

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check code with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Check CLI success
        run: python -c 'import subprocess, sys; result = subprocess.run([sys.executable, "-m", "project_tasks.cli", "data/tasks.csv", "reports/ci-report.txt"]); assert result.returncode == 0, f"CLI failed with code {result.returncode}"'

      - name: Check CLI error exit code
        run: python -c 'import subprocess, sys; result = subprocess.run([sys.executable, "-m", "project_tasks.cli", "missing-ci.csv", "reports/ci-error.txt"]); assert result.returncode != 0, "CLI should return a non-zero exit code for a missing input file"'

      - name: Build package
        run: python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: python/lab06/dist/*.whl
          if-no-files-found: error
